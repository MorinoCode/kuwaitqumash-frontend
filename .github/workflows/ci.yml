name: Frontend CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

jobs:
  branch-policy:
    name: Enforce Git Flow (only dev -> main)
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Verify source branch is dev
        run: |
          if [ "${{ github.head_ref }}" != "dev" ]; then
            echo "::error::Only the 'dev' branch can be merged into 'main' (attempted '${{ github.head_ref }}'). Please merge into 'dev' first."
            exit 1
          fi
          echo "Verified PR source branch is 'dev'."

  lint-test-build:
    name: Lint, Test & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run Vitest unit tests
        run: npm test

      - name: Verify production build
        run: npm run build
